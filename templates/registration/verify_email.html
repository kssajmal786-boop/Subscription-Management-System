{% extends "base.html" %}
{% block title %}Email Verification – Subscribify{% endblock %}

{% block auth_content %}
<div style="min-height:100vh;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="width:100%;max-width:480px;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:40px;box-shadow:0 12px 40px rgba(0,0,0,0.5);text-align:center;" class="animate-in">
    {% if success %}
    <div style="width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:32px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 8px 24px rgba(34,197,94,0.35);">
      <i class="bi bi-patch-check-fill"></i>
    </div>
    <h2 style="color:#f8fafc;font-weight:800;font-size:1.6rem;margin-bottom:8px;">Email Verified!</h2>
    <p style="color:#94a3b8;font-size:14px;line-height:1.6;">{{ message }}</p>

    <div class="mt-4">
      <a href="{% url 'dashboard:index' %}" class="btn btn-primary w-100" style="background:linear-gradient(135deg,#6366f1,#4f46e5);border:none;border-radius:8px;padding:12px;font-weight:600;">
        <i class="bi bi-speedometer2 me-1"></i> Proceed to Portal
      </a>
    </div>
    {% else %}
    <div style="width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:32px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 8px 24px rgba(239,68,68,0.35);">
      <i class="bi bi-x-circle-fill"></i>
    </div>
    <h2 style="color:#f8fafc;font-weight:800;font-size:1.6rem;margin-bottom:8px;">Verification Failed</h2>
    <p style="color:#ef4444;font-size:14px;line-height:1.6;">{{ message }}</p>

    <div class="mt-4">
      <a href="{% url 'accounts:login' %}" class="btn btn-outline-light w-100" style="border-radius:8px;padding:12px;">
        <i class="bi bi-arrow-left me-1"></i> Return to Login
      </a>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
